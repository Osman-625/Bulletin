name: Security Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Full URL to scan. Falls back to ZAP_TARGET_URL or PRODUCTION_URL repo variables.
        required: false
        type: string
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Resolve scan target
        id: target
        shell: bash
        run: |
          TARGET_URL="${{ github.event.inputs.target_url }}"

          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="${{ vars['ZAP_TARGET_URL'] }}"
          fi

          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="${{ vars['PRODUCTION_URL'] }}"
          fi

          if [ -z "$TARGET_URL" ]; then
            echo "::error::Set the target_url input, ZAP_TARGET_URL repo variable, or PRODUCTION_URL repo variable."
            exit 1
          fi

          echo "url=$TARGET_URL" >> "$GITHUB_OUTPUT"

      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ steps.target.outputs.url }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -m 5'
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline
