name: Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '23 19 * * *'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets['SUPABASE_DB_URL'] }}

    steps:
      - name: Check backup secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Set the SUPABASE_DB_URL repository secret before enabling daily backups."
            exit 1
          fi

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create custom-format backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backups
          timestamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          backup_file="backups/bulletin-${timestamp}.dump"
          pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges --file "$backup_file"
          sha256sum "$backup_file" > "$backup_file.sha256"

      - name: Upload encrypted-at-rest backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: bulletin-database-backup-${{ github.run_id }}
          path: |
            backups/*.dump
            backups/*.sha256
          retention-days: 7
          if-no-files-found: error
