name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      SETUP_SECRET: ${{ secrets.TEST_SETUP_SECRET }}
      TEST_OWNER_EMAIL: ${{ secrets.TEST_OWNER_EMAIL }}
      TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD }}
      TEST_SUPER_ADMIN_EMAIL: ${{ secrets.TEST_SUPER_ADMIN_EMAIL }}
      TEST_SUPER_ADMIN_PASSWORD: ${{ secrets.TEST_SUPER_ADMIN_PASSWORD }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      TEST_PUBLISHER_EMAIL: ${{ secrets.TEST_PUBLISHER_EMAIL }}
      TEST_PUBLISHER_PASSWORD: ${{ secrets.TEST_PUBLISHER_PASSWORD }}
      TEST_FORCE_CHANGE_EMAIL: ${{ secrets.TEST_FORCE_CHANGE_EMAIL }}
      TEST_FORCE_CHANGE_PASSWORD: ${{ secrets.TEST_FORCE_CHANGE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check Supabase types are current
        run: |
          PROJECT_ID=$(echo "$NEXT_PUBLIC_SUPABASE_URL" | sed 's|https://||' | cut -d. -f1)
          npx supabase gen types typescript --project-id "$PROJECT_ID" > /tmp/database.types.generated.ts
          diff src/lib/database.types.ts /tmp/database.types.generated.ts || \
            (echo "::error::Supabase types are out of sync — run: npx supabase gen types typescript --project-id $PROJECT_ID > src/lib/database.types.ts" && exit 1)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
