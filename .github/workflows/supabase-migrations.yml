name: Supabase Migrations

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
  workflow_dispatch:
    inputs:
      target:
        description: Supabase project to check or migrate.
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      apply:
        description: Apply migrations after the dry run passes.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pull-request-dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - name: Check required secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_ID" ]; then
            echo "::warning::Staging Supabase secrets not configured — skipping migration dry-run"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Link staging project
        if: steps.check.outputs.configured == 'true'
        run: supabase link --project-ref "$PROJECT_ID"
      - name: Dry-run migrations
        if: steps.check.outputs.configured == 'true'
        run: supabase db push --dry-run

  workflow-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ inputs.target == 'production' && secrets.PRODUCTION_PROJECT_ID || secrets.STAGING_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ inputs.target == 'production' && secrets.PRODUCTION_DB_PASSWORD || secrets.STAGING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - name: Check required secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$PROJECT_ID"
      - name: Link selected project
        run: supabase link --project-ref "$PROJECT_ID"
      - name: Dry-run migrations
        run: supabase db push --dry-run
      - name: Apply migrations
        if: ${{ inputs.apply }}
        run: supabase db push
